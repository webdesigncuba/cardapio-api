name: Laravel Lint & Static Analysis

on:
  pull_request:
    branches:
      - develop
      - release/*
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@3d3c42e3d9f5f3e0a1b2c6d7e8f9a0b1c2d3e4f # v4.1.7

      - name: Configurar PHP
        uses: shivammathur/setup-php@f3e473d9c071dfaccd61244454db1234567890ab # v2.30.0
        with:
          php-version: '8.2'

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist

      - name: Ejecutar PHPStan
        run: ./vendor/bin/phpstan analyse --level=max app/

      - name: Ejecutar PHPCS
        run: ./vendor/bin/phpcs --standard=PSR12 app/

name: Coverage Check

on:
  pull_request:
    branches:
      - develop
      - release/*
      - main

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d5d5ecf9f5e4d8a0 # v4.1.7

      - name: Configurar PHP
        uses: shivammathur/setup-php@e6d6a2f9b6c3c7f5c9a1f0d8a7b2c3d4e5f6a7b8 # v2.30.0
        with:
          php-version: '8.2'
          coverage: xdebug

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist

      - name: Ejecutar pruebas con cobertura
        run: ./vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Publicar cobertura en Codecov
        uses: codecov/codecov-action@845f3f8a3d2c7b9e1f0a2d3c4b5a6d7e8f9a0b1c # v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true

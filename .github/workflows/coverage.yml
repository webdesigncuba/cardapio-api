name: Coverage Check

on:
  pull_request:
    branches:
      - develop
      - release/*
      - main

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@f548e57c1a9d3c42e12cd22362661c4e8d430763

      - name: Configurar PHP
        uses: shivammathur/setup-php@b9ef680c1234567890abcdef1234567890abcdef
        with:
          php-version: '8.2'
          coverage: xdebug

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist

      - name: Ejecutar pruebas con cobertura
        run: ./vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Publicar cobertura en Codecov
        uses: codecov/codecov-action@fb8b358c1234567890abcdef1234567890abcdef
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
